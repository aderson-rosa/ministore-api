spring:
  application:
    name: ministore-api

  # Perfil padrao: H2 em memoria (roda sem instalar nada).
  # Para Postgres, use o perfil "postgres" (SPRING_PROFILES_ACTIVE=postgres).
  datasource:
    url: jdbc:h2:mem:ministore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html
