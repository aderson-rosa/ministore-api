spring:
  application:
    name: ministore-api

  # Mensageria: RabbitMQ (suba com "docker compose up").
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  # Perfil padrao: H2 em memoria (roda sem instalar nada).
  # Para Postgres, use o perfil "postgres" (SPRING_PROFILES_ACTIVE=postgres).
  datasource:
    url: jdbc:h2:mem:ministore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Observabilidade: expoe health e metricas Prometheus em /actuator/prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ministore-api

# Correlation id aparece em todos os logs (via MDC)
logging:
  pattern:
    level: "%5p [cid=%X{correlationId:-}]"
